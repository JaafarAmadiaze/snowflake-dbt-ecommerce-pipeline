name: dbt CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'dbt_ecommerce/**'
      - '.github/workflows/dbt_ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'dbt_ecommerce/**'
      - '.github/workflows/dbt_ci.yml'

jobs:
  # =========================================================================
  # 1. Continuous Integration (Pull Request Checks)
  # =========================================================================
  continuous_integration:
    name: "CI: Verify Pull Request"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dbt_ecommerce

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'ACCOUNTADMIN' }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'ECOMMERCE_DWH' }}
      SNOWFLAKE_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
      DBT_TARGET: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      - name: Verify dbt compilation & syntax
        run: dbt compile --profiles-dir .

      - name: Run & Test models in CI schema
        run: dbt build --profiles-dir .

  # =========================================================================
  # 2. Continuous Deployment (Production Deployment)
  # =========================================================================
  continuous_deployment:
    name: "CD: Deploy to Production"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dbt_ecommerce

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE || 'ACCOUNTADMIN' }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE || 'ECOMMERCE_DWH' }}
      SNOWFLAKE_SCHEMA: ANALYTICS
      DBT_TARGET: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake

      - name: Install dbt packages
        run: dbt deps --profiles-dir .

      - name: Run production dbt build (Update Gold Marts & Tests)
        run: dbt build --profiles-dir .
